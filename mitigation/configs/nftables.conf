# nftables baseline for a Minecraft edge host.
#
# This is the "no eBPF toolchain, just give me something tonight" version of
# ../network/xdp_connguard.c. It's strictly weaker (nftables' rate limiting
# is per-rule, evaluated per-packet in the normal netfilter path rather than
# at the XDP hook, so it costs more CPU per packet and reacts slightly later)
# but it's a five-minute deploy with tools already on most distros. Replace
# with the eBPF program once you've validated thresholds here.
#
# Apply with: nft -f nftables.conf

table inet mc_shield {

    # Per-source-IP new-connection rate limit on the Minecraft port.
    # Mirrors xdp_connguard.c's BURST=5 / REFILL_NS=2s (i.e. ~1 new conn per
    # 2s sustained, bursts of 5) - tune identically if you run both so a
    # connection isn't dropped by one layer's stricter idea of the same rule.
    chain input {
        type filter hook input priority filter; policy accept;

        tcp dport 25565 tcp flags syn tcp flags != syn|ack \
            ct state new \
            meter mc-conn-rate { ip saddr timeout 5m limit rate over 1/second burst 5 packets } \
            drop

        # Hard blocklist set, kept in sync by the userspace daemon described
        # in ../network/README.md (same role as xdp_connguard.c's `blocklist`
        # map, for hosts not running the eBPF programs).
        ip saddr @mc-blocklist drop
    }
}

# Populate/inspect the blocklist set:
#   nft add element inet mc_shield mc-blocklist { 203.0.113.7 }
#   nft list set inet mc_shield mc-blocklist

# Define the set once, ahead of the table body above if loading standalone:
#   table inet mc_shield {
#       set mc-blocklist { type ipv4_addr; flags timeout; }
#       ...
#   }
